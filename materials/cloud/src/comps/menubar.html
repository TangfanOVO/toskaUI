<div class="dmbar" id="menubar">
  <canvas aria-hidden="true"></canvas>
  <div class="mbar" role="menubar" aria-label="应用菜单">
    <button type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false" aria-controls="mb1" id="mbt1" tabindex="0">文件</button>
    <button type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false" aria-controls="mb2" id="mbt2" tabindex="-1">编辑</button>
    <button type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false" aria-controls="mb3" id="mbt3" tabindex="-1">视图</button>
  </div>
  <div class="mbmenu" id="mb1" role="menu" aria-labelledby="mbt1" hidden>
    <button type="button" role="menuitem" tabindex="-1">新标签页<kbd>⌘T</kbd></button>
    <button type="button" role="menuitem" tabindex="-1">新窗口<kbd>⌘N</kbd></button>
    <div class="ddsep" role="separator"></div>
    <button type="button" role="menuitem" tabindex="-1">分享</button>
    <button type="button" role="menuitem" tabindex="-1">打印<kbd>⌘P</kbd></button>
  </div>
  <div class="mbmenu" id="mb2" role="menu" aria-labelledby="mbt2" hidden>
    <button type="button" role="menuitem" tabindex="-1">撤销<kbd>⌘Z</kbd></button>
    <button type="button" role="menuitem" tabindex="-1">重做<kbd>⇧⌘Z</kbd></button>
    <div class="ddsep" role="separator"></div>
    <button type="button" role="menuitem" tabindex="-1">剪切<kbd>⌘X</kbd></button>
    <button type="button" role="menuitem" tabindex="-1">复制<kbd>⌘C</kbd></button>
    <button type="button" role="menuitem" tabindex="-1">粘贴<kbd>⌘V</kbd></button>
  </div>
  <div class="mbmenu" id="mb3" role="menu" aria-labelledby="mbt3" hidden>
    <button type="button" role="menuitem" tabindex="-1">显示书签栏</button>
    <button type="button" role="menuitem" tabindex="-1">重新加载<kbd>⌘R</kbd></button>
    <button type="button" role="menuitem" tabindex="-1">全屏</button>
  </div>
</div>
