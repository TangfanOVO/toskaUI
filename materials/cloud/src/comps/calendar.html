<div class="dcal" id="cal">
  <canvas aria-hidden="true"></canvas>
  <div class="calhead">
    <button type="button" class="calnav" data-d="-1" aria-label="上个月">‹</button>
    <h3 class="caltitle lt" id="calTitle" aria-live="polite"></h3>
    <button type="button" class="calnav" data-d="1" aria-label="下个月">›</button>
  </div>
  <table class="calgrid" role="grid" aria-labelledby="calTitle">
    <thead><tr><th scope="col" abbr="星期日">日</th><th scope="col" abbr="星期一">一</th><th scope="col" abbr="星期二">二</th><th scope="col" abbr="星期三">三</th><th scope="col" abbr="星期四">四</th><th scope="col" abbr="星期五">五</th><th scope="col" abbr="星期六">六</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
