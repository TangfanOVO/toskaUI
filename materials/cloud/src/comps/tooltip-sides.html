<div class="slot">
  <div class="tipx" id="tipx">
    <canvas aria-hidden="true"></canvas>
    <button type="button" class="round" data-side="top" aria-label="上" aria-describedby="txTop">↑</button>
    <button type="button" class="round" data-side="left" aria-label="左" aria-describedby="txLeft">←</button>
    <button type="button" class="round" data-side="right" aria-label="右" aria-describedby="txRight">→</button>
    <button type="button" class="round" data-side="bottom" aria-label="下" aria-describedby="txBottom">↓</button>
    <div class="tip-pop" id="txTop" role="tooltip" hidden>从上面冒出来</div>
    <div class="tip-pop" id="txLeft" role="tooltip" hidden>往左边飘</div>
    <div class="tip-pop" id="txRight" role="tooltip" hidden>往右边飘</div>
    <div class="tip-pop" id="txBottom" role="tooltip" hidden>从下面垂下来</div>
  </div>
</div>
