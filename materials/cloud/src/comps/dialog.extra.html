<div class="dlg-layer" id="dlgLayer" hidden>
  <div class="dlg-back" id="dlgBack"></div>
  <canvas class="dlg-fx" aria-hidden="true"></canvas>
  <div class="dlg" id="dlg" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" hidden>
    <h3 id="dlgTitle">编辑资料</h3>
    <p>在这里修改你的资料，改好了点保存。</p>
    <label class="fld"><span>名字</span><input id="fName" type="text" value="幡幡"></label>
    <label class="fld"><span>用户名</span><input id="fUser" type="text" value="@toska"></label>
    <div class="dlg-actions"><button type="button" class="dbtn2" id="dlgSave">保存修改</button></div>
    <button type="button" class="dlg-x" id="dlgX" aria-label="关闭">×</button>
  </div>
  <div class="dlg" id="alertDlg" tabindex="-1" role="alertdialog" aria-modal="true" aria-labelledby="alTitle" aria-describedby="alDesc" hidden>
    <h3 id="alTitle">确定要删除吗？</h3>
    <p id="alDesc">这一步没法撤销。你的账号和所有数据都会从服务器上永久删除。</p>
    <div class="dlg-actions"><button type="button" class="dbtn3" id="alCancel">取消</button><button type="button" class="dbtn2" id="alOk">是的，删除账号</button></div>
  </div>
</div>
