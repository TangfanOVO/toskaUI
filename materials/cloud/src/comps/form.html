<form class="dform" id="form" novalidate>
  <canvas aria-hidden="true"></canvas>
  <div class="frow"><label for="fmName" class="lbl">名字</label><input id="fmName" class="lin" type="text" placeholder="幡幡" autocomplete="off" aria-describedby="fmNameMsg"><span class="fmsg" id="fmNameMsg"><span class="fdesc">别人看到的名字</span><span class="ferr" hidden>名字不能空着</span></span></div>
  <div class="frow"><label for="fmMail" class="lbl">邮箱</label><input id="fmMail" class="lin" type="email" placeholder="toska@example.com" autocomplete="off" aria-describedby="fmMailMsg"><span class="fmsg" id="fmMailMsg"><span class="fdesc">用来登录</span><span class="ferr" hidden>邮箱格式不对</span></span></div>
  <div class="factions"><button type="submit" class="ghost" id="fmSubmit">提交</button><span class="fok" id="fmOk" aria-hidden="true" hidden>已提交</span><span class="sr" id="fmLive" role="status"></span></div>
</form>
