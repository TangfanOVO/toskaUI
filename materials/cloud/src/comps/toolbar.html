  <canvas aria-hidden="true"></canvas>

    <button type="button" aria-pressed="false" aria-label="斜体" data-k="i"><i>I</i></button>

    <button type="button" role="radio" aria-checked="false" aria-label="右对齐"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 3.5h12M6 6.5h8M2 9.5h12M6 12.5h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>

</div>
