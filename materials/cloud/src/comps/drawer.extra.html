<div class="drw-layer" id="drwLayer" hidden>
  <div class="drw-back" id="drwBack"></div>
  <canvas class="drw-fx" aria-hidden="true"></canvas>
  <div class="drw" id="drw" role="dialog" aria-modal="true" aria-labelledby="drwTitle" aria-describedby="drwDesc" tabindex="-1">
    <div class="drw-handle" aria-hidden="true"></div>
    <h3 id="drwTitle">每天的活动目标</h3>
    <p id="drwDesc">每天想消耗多少千卡？往下拖也能关掉。</p>
    <div class="drw-num"><button type="button" class="drw-b" data-d="-10" aria-label="减 10">−</button><div><b id="drwVal" aria-live="polite">350</b><span>千卡 / 天</span></div><button type="button" class="drw-b" data-d="10" aria-label="加 10">+</button></div>
    <button type="button" class="drw-ok" id="drwOk">好</button>
  </div>
</div>
