<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分隔条 · toskaUI</title>
<!-- toskaUI · 烟云 · 分隔条（对应 Reka UI 的 Splitter）
     一个文件就能跑：存成 .html，用浏览器打开。颜色在 :root 的几个变量里，手感在脚本里的 F（速度、弹性、扭曲、烟雾）。
     灵感来自 goopUI（Tim McMasters），结构、尺寸和示例文字参考 Reka UI。 -->
<script>try{var m=location.hash.match(/theme-(dark|light|white)/);if(m)document.documentElement.setAttribute("data-theme",m[1]);}catch(e){}</script>
<style>
:root{
  --bg:#f8f7f4; --ink:#1a1918; --muted:#6f6b64; --dot:#dddbd5; --line:#e7e5e0;
  --body:#1a1918; --body-ink:#f8f7f4; --body-muted:#a8a59f; --track:#e1dfda;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="white"]){
    --bg:#131312; --ink:#efeee9; --muted:#8f8c86; --dot:#282725; --line:#2a2927;
    --body:#efeee9; --body-ink:#131312; --body-muted:#5f5c57; --track:#2c2b28;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131312; --ink:#efeee9; --muted:#8f8c86; --dot:#282725; --line:#2a2927;
  --body:#efeee9; --body-ink:#131312; --body-muted:#5f5c57; --track:#2c2b28;
  color-scheme:dark;
}
/* 灰底白云：阴天的天色，白云浮在上面。只换这几个颜色，所有组件跟着变 */
:root[data-theme="white"]{
  --bg:#c4c9cf; --ink:#1b1e22; --muted:#4e5761; --dot:#b6bcc3; --line:#b2b8bf;
  --body:#ffffff; --body-ink:#1b1e22; --body-muted:#6b737c; --track:#b4bac1;
  color-scheme:light;
}
/* 弹层的两种样子：实心卡（卡片是组件的颜色，选中是底色）／浅色卡（卡片是底色，选中的那块是实心、流过去） */
:root{--card:var(--body);--card-ink:var(--body-ink);--card-muted:var(--body-muted);--hl:var(--bg);--hl-ink:var(--ink)}
:root[data-card="light"]{--card:var(--bg);--card-ink:var(--ink);--card-muted:var(--muted);--hl:var(--body);--hl-ink:var(--body-ink)}
*{box-sizing:border-box}
html,body{margin:0}
/* 演示用的假鼠标：按下时缩一下，底下荡开一圈 */
.demo-cursor{position:fixed;left:-3px;top:-2px;z-index:9999;width:24px;height:24px;pointer-events:none;opacity:0;transition:opacity .25s;filter:drop-shadow(0 1px 2px rgb(0 0 0 / .25))}
.demo-cursor.on{opacity:1}
.demo-run :focus-visible{outline:none!important}
.demo-run .chsl:focus-visible::after{display:none}
.demo-cursor svg{display:block;transform-origin:5px 3px;transition:transform .12s}
.demo-cursor.down svg{transform:scale(.84)}
.demo-cursor i{position:absolute;left:-9px;top:-10px;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);opacity:0;transform:scale(.3)}
.demo-cursor.down i{opacity:.45;transform:scale(1);transition:transform .25s,opacity .25s}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:940px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:22px;line-height:1.3;margin:0 0 4px;font-weight:650}
.lead{margin:0 0 18px;color:var(--muted)}
.themes{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 12px}
.tlab{font-size:13px;color:var(--muted);margin-right:4px}
.themes button{font:inherit;font-size:13.5px;padding:5px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.themes button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;
  background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px;
  display:grid;grid-template-columns:1fr 1fr}
@media (max-width:720px){.stage{grid-template-columns:1fr}}
.demo{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 16px 28px;text-align:center}
.cap{font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
.slot{min-height:76px;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap}
.tip{margin:0;font-size:12.5px;color:var(--muted);max-width:260px;line-height:1.55}
.demo.pop{min-height:290px;justify-content:flex-start}
.demo.wide{grid-column:1/-1}
.stage input{-webkit-user-select:text;user-select:text}
.themes,.presets{-webkit-tap-highlight-color:transparent}
.grp{grid-column:1/-1;margin:0;padding:22px 20px 0;font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--muted);border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.col{flex-direction:column;align-items:flex-start;gap:12px}
.ddsep{height:1px;margin:4px 6px;background:var(--card-muted);opacity:.5}
.ghost:disabled,.ghost[aria-disabled="true"]{opacity:.4;cursor:default}
.sval{font-variant-numeric:tabular-nums;font-size:14px;min-width:2.2em;text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ghost{height:36px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.pcol{display:flex;flex-direction:column;align-items:center;gap:14px}
.plabel{font-size:13.5px;font-variant-numeric:tabular-nums}
.trigger{height:40px;padding:0 20px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
/* 卡片本身是一团云，焦点落在卡片上时不画方框；里面的选项照常有焦点圈 */
/* 烟可能飘过的字：放在烟上面，再描一圈底色，盖住了也看得清 */
.cap,.tip,.sval,.plabel,.lt{position:relative;z-index:3;text-shadow:0 0 2px var(--bg),0 0 5px var(--bg),0 0 9px var(--bg)}
.controls{margin-top:16px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
@media (max-width:720px){.controls{grid-template-columns:1fr}}
.controls h2{grid-column:1/-1;font-size:14px;margin:0 0 2px;font-weight:600}
.presets{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.presets button{font:inherit;font-size:14px;padding:6px 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.row output{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.row input{width:100%;accent-color:var(--ink);margin:6px 0 2px}
.row small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45}
.notes{margin:22px 2px 0;padding:0;list-style:none;color:var(--muted);font-size:13.5px}
.notes li{margin:0 0 6px;padding-left:14px;position:relative}
.notes li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.5}
/* 表单公用：标签文字、输入框、提示和错误 */
.lbl{font-size:13.5px;font-weight:600;color:var(--ink)}
.lin{position:relative;height:36px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;min-width:0;will-change:transform}
.lin{background-clip:padding-box}
.lin:focus{outline:none;border-color:transparent}   /* 焦点圈画在画布上：一圈实心线沿着框边流一圈 */
.lin::placeholder{color:var(--muted);opacity:.7}
.fmsg{position:relative;z-index:3;min-height:20px;font-size:12.5px;line-height:1.5;color:var(--muted);padding-left:14px}
.ferr{color:var(--ink);font-weight:500}
/* 弹出列表公用（选择框、组合框、自动补全） */
.selpop{position:absolute;left:0;top:calc(100% + 6px);padding:4px;z-index:5;text-align:left;transform-origin:50% 50%;outline:none}
.selpop [role=option],.selpop .none{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 10px;border-radius:8px;color:var(--card-ink);font-size:14px;cursor:pointer;user-select:none}
.selpop .none{color:var(--card-muted);cursor:default}
.selpop [role=option][data-hl="1"]{color:var(--hl-ink)}
.selpop [role=option] i{font-style:normal;font-size:12px;visibility:hidden}
.selpop [role=option][aria-selected="true"] i{visibility:visible}
.selpop:focus-visible{outline:none}
/* 日期公用：分段输入、月历、月份／年份格子 */
.dseg2{position:relative;display:inline-flex;align-items:center;gap:1px;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:transparent;font-variant-numeric:tabular-nums}
.dseg2:focus-within{border-color:transparent}
.dseg2 [role=spinbutton]{position:relative;z-index:5;display:inline-block;min-width:1.4em;padding:3px 3px;border-radius:6px;text-align:center;color:#fff;mix-blend-mode:difference;font-size:14.5px;outline:none;cursor:text;transform-origin:50% 60%;user-select:none;-webkit-user-select:none}
.dseg2 [role=spinbutton][data-empty]{opacity:.55}
.dseg2 .sl{position:relative;z-index:5;color:var(--muted);font-size:13px;padding:0 1px}
.dseg2 .dash{position:relative;z-index:5;margin:0 6px;color:var(--muted)}
.mg{width:270px}
.mghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.mgtitle{margin:0;font-size:14px;font-weight:600}
.mgnav{position:relative;z-index:5;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;line-height:1;cursor:pointer}
.mggrid{width:100%;table-layout:fixed;border-collapse:collapse}
.mggrid th{position:relative;z-index:3;height:24px;font-size:11.5px;font-weight:400;color:var(--muted)}
.mggrid td{padding:2px 0;height:36px;text-align:center}
.mggrid td button{position:relative;z-index:5;width:32px;max-width:100%;height:32px;border:0;padding:0;border-radius:50%;background:transparent;color:#fff;mix-blend-mode:difference;font:inherit;font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer}
.mggrid td button[data-today]{font-weight:700}
.mggrid td button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.tg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:250px}
.tg3 button{position:relative;z-index:5;height:40px;border:0;border-radius:10px;background:transparent;color:#fff;mix-blend-mode:difference;font:inherit;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.tg3 button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.oncard .mgtitle{color:var(--card-ink)}
.oncard .mgnav{background:transparent;border-color:var(--card-muted);color:var(--card-ink)}
.oncard .mggrid th{color:var(--card-muted)}
.oncard .mggrid td button{color:var(--card-ink);mix-blend-mode:normal}
.oncard .mggrid td button[data-on]{color:var(--hl-ink)}
.oncard .mggrid td button:focus-visible{outline-color:var(--card-ink)}
/* ================= 颜色公用：通道滑块（粗渐变轨道）、读数 ================= */
.chsl{position:relative;flex:none;width:var(--w,200px);height:24px;cursor:pointer;touch-action:none;border-radius:12px}
.chsl::before{content:"";position:absolute;left:0;right:0;top:5px;height:14px;border-radius:7px;background:var(--grad,var(--track));box-shadow:inset 0 0 0 1px rgb(0 0 0 / .07)}
.chsl canvas{position:absolute;left:-30px;top:-60px;width:calc(100% + 60px);height:114px;pointer-events:none;filter:url(#solid)}
.chsl:focus{outline:none}
.chsl:focus-visible::after{content:"";position:absolute;inset:-5px;border-radius:14px;border:2px solid var(--ink)}
.chrow{display:flex;align-items:center;gap:12px}
.chlab{flex:none;width:3.2em;font-size:12.5px;color:var(--muted);text-align:left}
.chval{flex:none;width:3.2em;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.cread{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.cread i{width:18px;height:18px;border-radius:6px;background:var(--c,var(--body));box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08)}
.cread code{font:inherit;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:.03em}

.dsplit canvas{filter:url(#solid)}
.shandle[data-ptr]:focus-visible{outline:none}
/* 分隔条 */
.dsplit{position:relative;display:flex;width:min(560px,100%);height:150px;border:1px solid var(--line);border-radius:14px}
.dsplit canvas{position:absolute;left:-24px;top:-40px;width:calc(100% + 48px);height:calc(100% + 80px);pointer-events:none}
.spane{position:relative;padding:0 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;white-space:nowrap;font-size:13px;color:var(--muted);min-width:0}
.spane b{font-size:17px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
#paneA{width:40%;flex:none}
#paneB{flex:1}
.shandle{position:absolute;top:0;bottom:0;left:calc(40% - 8px);width:16px;cursor:col-resize;touch-action:none;z-index:2;border-radius:8px}
.shandle:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
/* 弹出来的东西永远压在后面的组件上面（后面组件里的字有的带了层级） */
.selpop,.dppop,.mbmenu,.nvpanel,.hovcard,.ddmenu,.ctxmenu,.panel,.tip-pop{z-index:20}
.dsel canvas,.dcombo canvas,.dpick canvas,.dmbar canvas,.dnav canvas,.hovfx,.ddfx,.ctxfx,.popfx,.tipwrap canvas{z-index:19}
/* 这些组件的画布被抬高了，它们自己的字和按钮要再高一层，不然会被实心块盖住 */
.mbar button,.nvtrig,.seltrig,.dcombo .cbfield .lin,.dcombo .cbtog,.acghost,.hovlink,.dpick .dseg2 [role=spinbutton],.dpick .dseg2 .sl,.dpick .dseg2 .dash,.dpbtn{z-index:21}

/* 单独一页：组件放在正中间，不带说明 */
.wrap.solo{max-width:none;min-height:100vh;padding:0;display:flex}
.stage.solo{flex:1;display:flex;align-items:center;justify-content:center;min-height:100vh;border:0;border-radius:0}
.stage.solo .demo{width:100%;max-width:640px;padding:56px 16px}
.stage.solo .demo.pop{min-height:100vh;justify-content:flex-start;padding-top:64px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="solid" color-interpolation-filters="sRGB">
    <feComponentTransfer><feFuncA type="linear" slope="22" intercept="-10"/></feComponentTransfer>
  </filter>
</svg>
<div class="wrap solo"><section class="stage solo" id="stage">
  <div class="demo wide">
    <div class="dsplit" id="split">
      <canvas aria-hidden="true"></canvas>
      <div class="spane" id="paneA"><span>左边</span><b id="paneAv">40%</b></div>
      <div class="shandle" id="sHandle" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="paneA" aria-label="调整左右宽度" aria-valuemin="15" aria-valuemax="85" aria-valuenow="40"></div>
      <div class="spane" id="paneB"><span>右边</span><b id="paneBv">60%</b></div>
    </div>
  </div>
</section></div>

<script>
window.__DEMO = [["dragBy", "#sHandle", -90, 0, 700], ["wait", 400], ["dragBy", "#sHandle", 170, 0, 900], ["wait", 800], ["out"]];
(() => {
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const J = () => Math.random() - .5;
const $ = s => document.querySelector(s);
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
let reduced = reduceMQ.matches;

/* ---------- 手感 ---------- */
const F = { speed: .5, bounce: .5, deform: .55, smoke: .6 };
const PRESETS = {
  base:  { speed: .5,  bounce: .5,  deform: .55, smoke: .6 },
  crisp: { speed: .8,  bounce: .25, deform: .3,  smoke: .35 },
  jelly: { speed: .45, bounce: .85, deform: .95, smoke: .5 },
  smoky: { speed: .45, bounce: .45, deform: .55, smoke: 1 },
};
const resp = () => .5 - F.speed * .36;
const zeta = () => reduced ? 1 : 1 - F.bounce * .8;
const ptResp = () => .13 + (1 - F.speed) * .14;
const ptZeta = () => reduced ? 1 : .16 + (1 - F.bounce) * .5;
const deformK = () => reduced ? 0 : F.deform;
const smokeK = () => reduced ? 0 : F.smoke;
// 烟雾不只管冒出去的烟，也管组件"里面"：化开的雾团有多大、散多开，横条上的水珠能鼓多大，冒出去的烟有多浓
const fogSize = () => .7 + .6 * F.smoke;
const fogSpread = () => .55 + .75 * F.smoke;
const smokeDens = () => .8 + .34 * F.smoke;
function kc(r, z) { const w = TAU / r; return [w * w, 2 * z * w]; }
const spring = x => ({ x, v: 0, t: x });
function stepS(s, h, r, z) {
  const [k, c] = kc(r, z); s.v += (-k * (s.x - s.t) - c * s.v) * h; s.x += s.v * h;
  if (!Number.isFinite(s.x) || !Number.isFinite(s.v)) { s.x = Number.isFinite(s.t) ? s.t : 0; s.v = 0; }   // 万一算坏了，直接回到目标
}
const rb = (d, dim) => (1 - 1 / (d * 0.55 / dim + 1)) * dim;
function rubber(v, lo, hi, dim) { if (v < lo) return lo - rb(lo - v, dim); if (v > hi) return hi + rb(v - hi, dim); return v; }
function pushSample(a, x) { const t = performance.now(); a.push({ t, x }); while (a.length > 2 && t - a[0].t > 100) a.shift(); }
function vel(a, now) {
  if (a.length < 2) return 0;
  const p = a[0], q = a[a.length - 1];
  if (now !== undefined && now - q.t > 60) return 0;
  const dt = (q.t - p.t) / 1000;
  return dt < .008 ? 0 : clamp((q.x - p.x) / dt, -3000, 3000);
}
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/* ---------- 颜色和贴图 ---------- */
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = a => `rgb(${a.map(Math.round).join(',')})`;
const rgba = (a, o) => `rgba(${a.map(Math.round).join(',')},${o})`;
let C = {}, SPR = {};
// 一团烟：几团大小不一的软雾叠在一起，有起伏，不是正圆
function smokeSprite(c, seed) {
  const R = rng(seed), cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  for (let i = 0; i < 9; i++) {
    const x = 64 + (R() - .5) * 40, y = 64 + (R() - .5) * 40, rad = 20 + R() * 20, a = .28 + R() * .32;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, rgba(c, a)); gr.addColorStop(.5, rgba(c, a * .5)); gr.addColorStop(1, rgba(c, 0));
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill();
  }
  return cv;
}
function readTheme() {
  C = { bg: hex(cssVar('--bg')), body: hex(cssVar('--body')), track: hex(cssVar('--track')), bodyInk: hex(cssVar('--body-ink')), card: hex(cssVar('--card')), hl: hex(cssVar('--hl')), line: hex(cssVar('--line')) };
  C.trackOn = mixc(C.track, C.body, .45);
  C.smoke = C.body;   // 烟就是组件本身的材料，同一个颜色
  SPR.smoke = [11, 23, 37].map(s => smokeSprite(C.smoke, s));
